name: Build and publish Producer CLI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: producer-cli-publication-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,dev]' build
      - run: ruff check . && ruff format --check .
      - run: pytest
      - name: Set unique release version
        id: version
        run: |
          version="$(date -u +'%Y.%-m.%-d').${GITHUB_RUN_NUMBER}"
          export PACKAGE_VERSION="$version"
          python - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('pyproject.toml')
          text, count = re.subn(r'^version = "[^"]+"', 'version = "' + os.environ['PACKAGE_VERSION'] + '"', path.read_text(), count=1, flags=re.MULTILINE)
          assert count == 1
          path.write_text(text)
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - run: python -m pip install 'twine>=5,<6.1'
      - run: twine check dist/*
      - name: Publish exact build
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*
